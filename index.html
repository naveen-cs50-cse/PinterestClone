<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Pinterest-logo.png" alt="Pinterest Logo">
        </div>
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Create</a>
        </nav>
        <div class="search-bar">
            <span class="material-icons">search</span>
            <input type="text" placeholder="Search">
        </div>
        <div class="nav-icons">
            <span class="material-icons">notifications</span>
            <span class="material-icons">textsms</span>
            <div class="profile-pic">
                <img src="https://i.pravatar.cc/150?img=68" alt="Profile">
            </div>
            <span class="material-icons">keyboard_arrow_down</span>
        </div>
    </header>

    <nav class="mobile-nav">
        <a href="#" class="active"><span class="material-icons">home</span></a>
        <a href="#"><span class="material-icons">search</span></a>
        <a href="#"><span class="material-icons">add</span></a>
        <a href="#"><span class="material-icons">textsms</span></a>
        <a href="#"><img src="https://i.pravatar.cc/150?img=68" alt="Profile"></a>
    </nav>

    <main class="grid-container" id="pin-container"></main>

    <script src="script.js"></script>
</body>
</html>
